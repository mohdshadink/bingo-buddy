<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Optimized Drifting Animations using translate3d for GPU acceleration */
        @keyframes drift-1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(15%, 5%, 0) scale(1.05); }
            100% { transform: translate3d(0, 0, 0) scale(1); }
        }
        @keyframes drift-2 {
            0% { transform: translate3d(0, 0, 0) scale(1.05); }
            50% { transform: translate3d(-10%, -10%, 0) scale(0.95); }
            100% { transform: translate3d(0, 0, 0) scale(1.05); }
        }
        @keyframes drift-3 {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(5%, -10%, 0) rotate(180deg); }
            100% { transform: translate3d(0, 0, 0) rotate(360deg); }
        }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes float { 0% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -10px, 0); } 100% { transform: translate3d(0, 0, 0); } }
        
        /* Optimized Confetti: Animating transform instead of top */
        @keyframes confettiFall {
            0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(0, 110vh, 0) rotate(720deg); opacity: 0; }
        }
        
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .confetti {
            position: absolute;
            z-index: 101;
            will-change: transform;
            animation: confettiFall 3.5s linear infinite;
        }

        .glass-card {
            backdrop-filter: blur(15px) saturate(160%);
            -webkit-backdrop-filter: blur(15px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* Faster transitions */
        .theme-transition {
            transition: background-color 0.4s ease, color 0.3s ease;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px); /* Reduced blur for performance */
            z-index: 0;
            opacity: 0.45;
            will-change: transform;
            transition: background-color 0.6s ease;
        }
    </style>
</head>
<body class="theme-transition">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const BINGO_LETTERS = ['B', 'I', 'N', 'G', 'O'];

        const Confetti = () => {
            const pieces = useMemo(() => Array.from({ length: 45 }).map((_, i) => ({
                id: i,
                left: Math.random() * 100 + '%',
                delay: Math.random() * 3.5 + 's',
                color: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'][Math.floor(Math.random() * 6)],
                size: Math.random() * 8 + 4 + 'px'
            })), []);

            return pieces.map(p => (
                <div 
                    key={p.id} 
                    className="confetti" 
                    style={{ 
                        left: p.left, 
                        animationDelay: p.delay, 
                        backgroundColor: p.color,
                        width: p.size,
                        height: p.size,
                        borderRadius: Math.random() > 0.5 ? '50%' : '2px'
                    }} 
                />
            ));
        };

        const App = () => {
            const [gameState, setGameState] = useState('setup');
            const [setupMode, setSetupMode] = useState('random');
            const [theme, setTheme] = useState('dark');
            const [board, setBoard] = useState(Array(5).fill(null).map(() => Array(5).fill('')));
            const [marked, setMarked] = useState(Array(5).fill(null).map(() => Array(5).fill(false)));
            const [completedLines, setCompletedLines] = useState(new Set());

            const lettersStruckCount = Math.min(completedLines.size, 5);
            const isWinner = lettersStruckCount >= 5;

            const themeColors = useMemo(() => {
                const p = lettersStruckCount / 5;
                if (theme === 'dark') {
                    return {
                        base: '#020617',
                        blobs: [
                            `hsla(${240 + p * 40}, 70%, 35%, 0.4)`,
                            `hsla(${280 + p * 40}, 70%, 30%, 0.4)`,
                            `hsla(${210 + p * 40}, 70%, 25%, 0.4)`,
                            `hsla(${320 + p * 40}, 60%, 35%, 0.3)`,
                            `hsla(${180 + p * 40}, 60%, 30%, 0.3)`,
                            `hsla(${260 + p * 40}, 70%, 25%, 0.4)`
                        ]
                    };
                } else {
                    return {
                        base: '#f1f5f9',
                        blobs: [
                            `hsla(${350 - p * 80}, 80%, 75%, 0.5)`,
                            `hsla(${200 - p * 80}, 80%, 75%, 0.5)`,
                            `hsla(${150 - p * 80}, 70%, 80%, 0.5)`,
                            `hsla(${280 - p * 80}, 70%, 80%, 0.5)`,
                            `hsla(${45 - p * 80}, 80%, 80%, 0.5)`,
                            `hsla(${190 - p * 80}, 80%, 75%, 0.4)`
                        ]
                    };
                }
            }, [lettersStruckCount, theme]);

            const colors = {
                dark: {
                    card: 'bg-slate-900/65',
                    text: 'text-white',
                    subtext: 'text-slate-400',
                    accent: 'from-violet-600 to-indigo-700',
                    button: 'bg-indigo-600 hover:bg-indigo-500',
                    gridItem: 'bg-slate-800/60 border-white/10 text-white',
                    gridMarked: 'bg-gradient-to-br from-violet-500 to-fuchsia-600 border-violet-300 shadow-xl shadow-violet-500/20',
                    letterActive: 'bg-amber-400 text-slate-900 border-amber-200 shadow-xl shadow-amber-400/20',
                    letterInactive: 'bg-white/5 text-slate-500 border-white/5'
                },
                light: {
                    card: 'bg-white/70',
                    text: 'text-slate-900',
                    subtext: 'text-slate-500',
                    accent: 'from-rose-500 to-orange-500',
                    button: 'bg-rose-600 hover:bg-rose-500',
                    gridItem: 'bg-white/80 border-slate-200 text-slate-800',
                    gridMarked: 'bg-gradient-to-br from-rose-500 to-orange-500 border-white shadow-xl shadow-rose-500/20',
                    letterActive: 'bg-rose-600 text-white border-rose-300 shadow-xl shadow-rose-600/20',
                    letterInactive: 'bg-black/5 text-slate-400 border-black/5'
                }
            }[theme];

            const getCellErrors = useCallback(() => {
                const errors = Array(5).fill(null).map(() => Array(5).fill(false));
                const flatValues = board.flat().filter(v => v !== '');
                const counts = {};
                flatValues.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
                board.forEach((row, rIdx) => {
                    row.forEach((cell, cIdx) => {
                        if (cell === '') { errors[rIdx][cIdx] = true; return; }
                        const num = parseInt(cell, 10);
                        if (isNaN(num) || num < 1 || num > 25 || counts[cell] > 1) { errors[rIdx][cIdx] = true; }
                    });
                });
                return errors;
            }, [board]);

            const errors = getCellErrors();
            const hasErrors = errors.flat().some(e => e === true);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            const resetGame = () => {
                setGameState('setup');
                setMarked(Array(5).fill(null).map(() => Array(5).fill(false)));
                setCompletedLines(new Set());
                if (setupMode === 'random') generateRandomBoard();
            };

            const generateRandomBoard = useCallback(() => {
                const numbers = Array.from({ length: 25 }, (_, i) => (i + 1).toString());
                for (let i = numbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
                }
                const newBoard = [];
                for (let i = 0; i < 5; i++) { newBoard.push(numbers.slice(i * 5, (i + 1) * 5)); }
                setBoard(newBoard);
            }, []);

            useEffect(() => {
                if (setupMode === 'random' && gameState === 'setup') generateRandomBoard();
            }, [setupMode, gameState, generateRandomBoard]);

            const handleManualInputChange = (row, col, value) => {
                const cleaned = value.replace(/\D/g, '').slice(0, 2);
                const newBoard = board.map((r, ri) => r.map((c, ci) => (ri === row && ci === col ? cleaned : c)));
                setBoard(newBoard);
            };

            const checkLines = useCallback((currentMarked) => {
                const newLines = new Set();
                for (let r = 0; r < 5; r++) { if (currentMarked[r].every(c => c)) newLines.add(`row-${r}`); }
                for (let c = 0; c < 5; c++) {
                    let colWin = true;
                    for (let r = 0; r < 5; r++) { if (!currentMarked[r][c]) colWin = false; }
                    if (colWin) newLines.add(`col-${c}`);
                }
                let d1 = true, d2 = true;
                for (let i = 0; i < 5; i++) {
                    if (!currentMarked[i][i]) d1 = false;
                    if (!currentMarked[i][4 - i]) d2 = false;
                }
                if (d1) newLines.add('diag-1'); if (d2) newLines.add('diag-2');
                setCompletedLines(newLines);
            }, []);

            const toggleMark = (row, col) => {
                if (gameState !== 'playing' || isWinner) return;
                const newMarked = marked.map((r, rIdx) => r.map((c, cIdx) => (rIdx === row && cIdx === col ? !c : c)));
                setMarked(newMarked);
                checkLines(newMarked);
            };

            return (
                <div className="min-h-screen relative flex flex-col items-center p-4 md:p-8 font-sans overflow-y-auto theme-transition" style={{ backgroundColor: themeColors.base }}>
                    
                    {/* OPTIMIZED BACKGROUND LAYER */}
                    <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                        <div className="blob animate-drift-1" style={{ width: '70vw', height: '70vw', top: '-10%', left: '-20%', backgroundColor: themeColors.blobs[0], animationDuration: '10s' }}></div>
                        <div className="blob animate-drift-2" style={{ width: '60vw', height: '60vw', bottom: '-10%', right: '-10%', backgroundColor: themeColors.blobs[1], animationDuration: '14s' }}></div>
                        <div className="blob animate-drift-3" style={{ width: '50vw', height: '50vw', top: '20%', right: '-15%', backgroundColor: themeColors.blobs[2], animationDuration: '18s' }}></div>
                        <div className="blob animate-drift-1" style={{ width: '45vw', height: '45vw', bottom: '20%', left: '-10%', backgroundColor: themeColors.blobs[3], animationDuration: '12s', animationDelay: '-2s' }}></div>
                        <div className="blob animate-drift-2" style={{ width: '55vw', height: '55vw', top: '40%', left: '30%', backgroundColor: themeColors.blobs[4], animationDuration: '16s', animationDelay: '-5s' }}></div>
                        <div className="blob animate-drift-3" style={{ width: '40vw', height: '40vw', bottom: '40%', right: '30%', backgroundColor: themeColors.blobs[5], animationDuration: '22s', animationDelay: '-8s' }}></div>
                    </div>

                    <button 
                        onClick={toggleTheme}
                        className={`fixed top-4 right-4 z-[110] p-4 rounded-3xl shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center gap-3 font-black text-xs uppercase tracking-widest ${theme === 'dark' ? 'bg-slate-800 text-amber-300' : 'bg-white text-rose-600 shadow-lg shadow-rose-200/50'}`}
                    >
                        <span className="text-xl">{theme === 'dark' ? '☀️' : '🌙'}</span>
                        {theme === 'dark' ? 'Day' : 'Night'}
                    </button>

                    {isWinner && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-pop cursor-default">
                            <Confetti />
                            <div className={`${colors.card} glass-card border-4 ${theme === 'dark' ? 'border-violet-500' : 'border-rose-400'} rounded-[3rem] p-10 max-w-sm w-full text-center shadow-2xl relative z-[130]`}>
                                <div className="text-7xl mb-4 animate-float">🏆</div>
                                <h2 className={`text-5xl font-black ${theme === 'dark' ? 'text-violet-400' : 'text-rose-600'} mb-2 tracking-tighter uppercase italic`}>BINGO!</h2>
                                <p className={`${colors.subtext} mb-8 text-lg font-bold`}>Victory Achieved!</p>
                                <button onClick={resetGame} className={`w-full ${colors.button} text-white font-black py-5 rounded-[2rem] text-xl shadow-2xl transform transition-all active:scale-95`}>PLAY AGAIN</button>
                            </div>
                        </div>
                    )}

                    <div className={`relative z-10 max-w-md w-full ${colors.card} glass-card rounded-[3rem] shadow-[0_20px_80px_-15px_rgba(0,0,0,0.3)] overflow-hidden transition-all duration-300 ${isWinner ? 'blur-sm scale-95 opacity-50' : ''}`}>
                        
                        <div className={`bg-gradient-to-br ${colors.accent} p-8 text-center relative overflow-hidden`}>
                            <div className="absolute top-0 left-0 w-full h-full opacity-20 bg-[radial-gradient(circle_at_center,_white_1px,_transparent_1px)] bg-[size:30px_30px]"></div>
                            <h1 className="text-4xl font-black tracking-[0.2em] mb-8 text-white drop-shadow-2xl">BINGO BOT</h1>
                            <div className="flex justify-between gap-2.5">
                                {BINGO_LETTERS.map((letter, idx) => (
                                    <div 
                                        key={letter} 
                                        className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black transition-all duration-300 border-2 ${idx < lettersStruckCount ? colors.letterActive : colors.letterInactive}`}
                                    >
                                        {idx < lettersStruckCount ? '✓' : letter}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-8">
                            {gameState === 'setup' ? (
                                <div className="space-y-8">
                                    <div className={`flex p-1.5 rounded-[1.5rem] ${theme === 'dark' ? 'bg-black/20' : 'bg-black/5'}`}>
                                        <button 
                                            onClick={() => { setSetupMode('random'); generateRandomBoard(); }} 
                                            className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${setupMode === 'random' ? (theme === 'dark' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-rose-600 text-white shadow-md') : colors.subtext}`}
                                        >
                                            RANDOM
                                        </button>
                                        <button 
                                            onClick={() => { setSetupMode('manual'); setBoard(Array(5).fill(null).map(() => Array(5).fill(''))); }} 
                                            className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${setupMode === 'manual' ? (theme === 'dark' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-rose-600 text-white shadow-md') : colors.subtext}`}
                                        >
                                            MANUAL
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-5 gap-2.5">
                                        {board.map((row, rIdx) => row.map((cell, cIdx) => (
                                            <div key={`${rIdx}-${cIdx}`} className="aspect-square">
                                                <input 
                                                    type="text" 
                                                    value={cell} 
                                                    disabled={setupMode === 'random'} 
                                                    onChange={(e) => handleManualInputChange(rIdx, cIdx, e.target.value)} 
                                                    className={`w-full h-full text-center font-black text-xl rounded-xl border-2 transition-all outline-none ${
                                                        setupMode === 'random' 
                                                            ? colors.gridItem + ' opacity-50' 
                                                            : errors[rIdx][cIdx] && cell !== '' 
                                                                ? 'bg-red-500/10 border-red-500/50 text-red-500' 
                                                                : colors.gridItem + ' focus:border-indigo-500'
                                                    }`} 
                                                    placeholder="•" 
                                                />
                                            </div>
                                        )))}
                                    </div>
                                    <button 
                                        onClick={() => !hasErrors && setGameState('playing')} 
                                        disabled={hasErrors} 
                                        className={`w-full font-black py-6 rounded-[2rem] shadow-xl transition-all active:scale-95 text-lg tracking-widest ${hasErrors ? 'bg-slate-500/20 text-slate-500' : (theme === 'dark' ? 'bg-indigo-600 text-white shadow-indigo-500/20' : 'bg-rose-600 text-white shadow-rose-500/20')}`}
                                    >
                                        PLAY BINGO
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-10">
                                    <div className="grid grid-cols-5 gap-3">
                                        {board.map((row, rIdx) => row.map((cell, cIdx) => (
                                            <button 
                                                key={`${rIdx}-${cIdx}`} 
                                                onClick={() => toggleMark(rIdx, cIdx)} 
                                                className={`relative aspect-square rounded-2xl text-2xl font-black transition-all duration-200 border-2 ${marked[rIdx][cIdx] ? colors.gridMarked + ' text-white scale-90' : colors.gridItem + ' hover:border-black/10'}`}
                                            >
                                                {cell}
                                                {marked[rIdx][cIdx] && (
                                                    <div className="absolute inset-0 flex items-center justify-center opacity-40 text-4xl pointer-events-none">✨</div>
                                                )}
                                            </button>
                                        )))}
                                    </div>
                                    <button 
                                        onClick={resetGame} 
                                        className={`w-full font-black py-5 rounded-[1.5rem] border transition-all active:scale-95 text-[10px] uppercase tracking-[0.4em] ${theme === 'dark' ? 'bg-white/5 border-white/10 text-slate-400 hover:text-white' : 'bg-black/5 border-black/10 text-slate-500 hover:text-black'}`}
                                    >
                                        NEW GAME
                                    </button>
                                </div>
                            )}
                        </div>
                        
                        <div className={`p-6 border-t transition-all text-center ${theme === 'dark' ? 'bg-black/10 border-white/5' : 'bg-black/5 border-black/5'}`}>
                            <p className={`text-[10px] uppercase tracking-[0.5em] font-black ${theme === 'dark' ? 'text-slate-600' : 'text-slate-400'}`}>
                                {completedLines.size} / 5 COMPLETED
                            </p>
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
