<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        .animate-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const BINGO_LETTERS = ['B', 'I', 'N', 'G', 'O'];

        const App = () => {
            const [gameState, setGameState] = useState('setup');
            const [setupMode, setSetupMode] = useState('random');
            const [board, setBoard] = useState(Array(5).fill(null).map(() => Array(5).fill('')));
            const [marked, setMarked] = useState(Array(5).fill(null).map(() => Array(5).fill(false)));
            const [completedLines, setCompletedLines] = useState(new Set());

            const lettersStruckCount = Math.min(completedLines.size, 5);
            const isWinner = lettersStruckCount >= 5;

            const getCellErrors = useCallback(() => {
                const errors = Array(5).fill(null).map(() => Array(5).fill(false));
                const flatValues = board.flat().filter(v => v !== '');
                const counts = {};
                flatValues.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
                board.forEach((row, rIdx) => {
                    row.forEach((cell, cIdx) => {
                        if (cell === '') { errors[rIdx][cIdx] = true; return; }
                        const num = parseInt(cell, 10);
                        if (isNaN(num) || num < 1 || num > 25 || counts[cell] > 1) { errors[rIdx][cIdx] = true; }
                    });
                });
                return errors;
            }, [board]);

            const errors = getCellErrors();
            const hasErrors = errors.flat().some(e => e === true);

            const resetGame = () => {
                setGameState('setup');
                setMarked(Array(5).fill(null).map(() => Array(5).fill(false)));
                setCompletedLines(new Set());
                if (setupMode === 'random') generateRandomBoard();
            };

            const generateRandomBoard = useCallback(() => {
                const numbers = Array.from({ length: 25 }, (_, i) => (i + 1).toString());
                for (let i = numbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
                }
                const newBoard = [];
                for (let i = 0; i < 5; i++) { newBoard.push(numbers.slice(i * 5, (i + 1) * 5)); }
                setBoard(newBoard);
            }, []);

            useEffect(() => {
                if (setupMode === 'random' && gameState === 'setup') generateRandomBoard();
            }, [setupMode, gameState, generateRandomBoard]);

            const handleManualInputChange = (row, col, value) => {
                const cleaned = value.replace(/\D/g, '').slice(0, 2);
                const newBoard = board.map((r, ri) => r.map((c, ci) => (ri === row && ci === col ? cleaned : c)));
                setBoard(newBoard);
            };

            const checkLines = useCallback((currentMarked) => {
                const newLines = new Set();
                for (let r = 0; r < 5; r++) { if (currentMarked[r].every(c => c)) newLines.add(`row-${r}`); }
                for (let c = 0; c < 5; c++) {
                    let colWin = true;
                    for (let r = 0; r < 5; r++) { if (!currentMarked[r][c]) colWin = false; }
                    if (colWin) newLines.add(`col-${c}`);
                }
                let d1 = true, d2 = true;
                for (let i = 0; i < 5; i++) {
                    if (!currentMarked[i][i]) d1 = false;
                    if (!currentMarked[i][4 - i]) d2 = false;
                }
                if (d1) newLines.add('diag-1'); if (d2) newLines.add('diag-2');
                setCompletedLines(newLines);
            }, []);

            const toggleMark = (row, col) => {
                if (gameState !== 'playing' || isWinner) return;
                const newMarked = marked.map((r, rIdx) => r.map((c, cIdx) => (rIdx === row && cIdx === col ? !c : c)));
                setMarked(newMarked);
                checkLines(newMarked);
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center p-4 md:p-8 font-sans text-slate-100 relative overflow-hidden">
                    {isWinner && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-pop cursor-default">
                            <div className="bg-slate-900 border-4 border-yellow-400 rounded-[2.5rem] p-10 max-w-sm w-full text-center shadow-[0_0_60px_rgba(250,204,21,0.6)]">
                                <div className="text-7xl mb-6 animate-float">🏆</div>
                                <h2 className="text-5xl font-black text-yellow-400 mb-4 tracking-tighter uppercase">BINGO!</h2>
                                <p className="text-slate-300 mb-10 text-lg">Victory is yours!</p>
                                <button onClick={resetGame} className="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-black py-5 rounded-2xl text-2xl shadow-xl transform transition active:scale-95">PLAY AGAIN</button>
                            </div>
                        </div>
                    )}
                    <div className={`max-w-md w-full bg-slate-900 rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-800 transition-all duration-700 ${isWinner ? 'blur-sm scale-95 opacity-50' : ''}`}>
                        <div className="bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 p-8 text-center">
                            <h1 className="text-3xl font-black tracking-[0.2em] mb-6 text-white">BINGO BOT</h1>
                            <div className="flex justify-between gap-2">
                                {BINGO_LETTERS.map((letter, idx) => (
                                    <div key={letter} className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-bold transition-all border-2 ${idx < lettersStruckCount ? 'bg-yellow-400 border-yellow-200 text-indigo-950 scale-110 shadow-[0_0_20px_rgba(250,204,21,0.4)]' : 'bg-indigo-900/40 border-indigo-500/30 text-indigo-300 opacity-50'}`}>
                                        {idx < lettersStruckCount ? '✓' : letter}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-6 md:p-8">
                            {gameState === 'setup' ? (
                                <div className="space-y-6">
                                    <div className="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
                                        <button onClick={() => { setSetupMode('random'); generateRandomBoard(); }} className={`flex-1 py-3 rounded-xl transition-all ${setupMode === 'random' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>🎲 Random</button>
                                        <button onClick={() => { setSetupMode('manual'); setBoard(Array(5).fill(null).map(() => Array(5).fill(''))); }} className={`flex-1 py-3 rounded-xl transition-all ${setupMode === 'manual' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>✏️ Manual</button>
                                    </div>
                                    <div className="grid grid-cols-5 gap-2.5">
                                        {board.map((row, rIdx) => row.map((cell, cIdx) => (
                                            <div key={`${rIdx}-${cIdx}`} className="aspect-square">
                                                <input type="text" value={cell} disabled={setupMode === 'random'} onChange={(e) => handleManualInputChange(rIdx, cIdx, e.target.value)} className={`w-full h-full text-center font-bold text-xl rounded-xl border-2 transition-all outline-none ${setupMode === 'random' ? 'bg-slate-800 border-slate-700 text-slate-300' : errors[rIdx][cIdx] && cell !== '' ? 'bg-red-950/30 border-red-500 text-red-200' : 'bg-slate-950 border-slate-700 text-white focus:border-indigo-500'}`} />
                                            </div>
                                        )))}
                                    </div>
                                    <button onClick={() => !hasErrors && setGameState('playing')} disabled={hasErrors} className={`w-full font-black py-5 rounded-2xl shadow-xl transition-all active:scale-95 text-lg ${hasErrors ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-indigo-600 text-white'}`}>▶️ START GAME</button>
                                </div>
                            ) : (
                                <div className="space-y-8">
                                    <div className="grid grid-cols-5 gap-2.5">
                                        {board.map((row, rIdx) => row.map((cell, cIdx) => (
                                            <button key={`${rIdx}-${cIdx}`} onClick={() => toggleMark(rIdx, cIdx)} className={`relative aspect-square rounded-2xl text-2xl font-black transition-all border-2 ${marked[rIdx][cIdx] ? 'bg-indigo-600 border-indigo-400 text-white scale-95 shadow-inner' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                                {cell}
                                                {marked[rIdx][cIdx] && <div className="absolute inset-0 flex items-center justify-center opacity-20 text-4xl">✅</div>}
                                            </button>
                                        )))}
                                    </div>
                                    <button onClick={resetGame} className="w-full bg-slate-800 text-slate-400 font-bold py-5 rounded-2xl border border-slate-700 transition-all active:scale-95">🔄 RESTART</button>
                                </div>
                            )}
                        </div>
                        <div className="p-5 bg-slate-950 border-t border-slate-800/50 text-center">
                            <p className="text-[10px] text-slate-500 uppercase tracking-[0.3em] font-bold">Progress: {completedLines.size} / 5 lines</p>
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
